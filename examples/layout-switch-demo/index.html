<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodera layout-switch demo — the host switches the graph layout</title>
    <style>
      /*
       * Host chrome only.
       *
       * The editor surfaces are styled by the framework with `var(--ndr-*)`
       * tokens, and the canvas engine ships its own stylesheet, which this host
       * imports from `src/main.tsx`. Everything below fills the viewport,
       * styles this demo's own controls above the canvas, and supplies the
       * token values the framework chrome reads. The host owns the layout of
       * its own page; it never styles inside the canvas.
       */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      /*
       * The provider between `#root` and this page's own `.demo-host` is a real
       * element (the theme root), so the height chain has to cross it or the
       * host's page collapses to its content height and the editor's canvas
       * region never gets any space.
       */
      #root > [data-nodera-theme] {
        height: 100%;
      }

      body {
        background: #0b1220;
        color: #e5e9f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
      }

      .demo-host {
        display: flex;
        flex-direction: column;
        gap: 6px;
        height: 100%;
        padding: 6px;
        box-sizing: border-box;
      }

      .demo-header {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 6px 8px;
        border: 1px solid #24344d;
        border-radius: 6px;
        background: #131c2b;
      }

      .demo-header h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }

      /*
       * The current state, in one line, so the panel can stay collapsed and the
       * header still says what the canvas is doing.
       */
      .demo-summary {
        margin: 0 0 0 auto;
        color: #94a3b8;
        font-size: 11px;
      }

      .demo-disclosure {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border: 1px solid #2f3b4f;
        border-radius: 5px;
        background: #1a2333;
        color: #e5e9f0;
        font-family: inherit;
        font-size: 11px;
        line-height: 1.4;
        cursor: pointer;
      }

      /*
       * Expanded state is carried by the glyph and `aria-expanded`; the border is
       * a second cue, never the only one.
       */
      .demo-disclosure[aria-expanded="true"] {
        border-color: #f59e0b;
        color: #fde68a;
      }

      .demo-options {
        padding: 6px 8px;
        border: 1px solid #24344d;
        border-radius: 6px;
        background: #101a29;
        /* A taller group (the edge-style one has six controls) must never
           squeeze the canvas: the panel scrolls instead, so the canvas keeps
           its flex space and the phantom placeholders stay inside it. */
        max-height: 42vh;
        overflow-y: auto;
      }

      /* A collapsed panel must not keep any display override alive. */
      .demo-options[hidden] {
        display: none;
      }

      .demo-options-body {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .demo-group {
        margin: 0;
        padding: 4px 8px 6px;
        border: 1px solid #2f3b4f;
        border-radius: 6px;
        min-width: 0;
      }

      .demo-group legend {
        padding: 0 4px;
        color: #cbd5e1;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .demo-group-body {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .demo-state {
        margin: 0;
        padding: 2px 6px;
        border: 1px dashed #2f3b4f;
        border-radius: 5px;
        color: #cbd5e1;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11px;
      }

      .demo-note {
        margin: 0;
        max-width: 34ch;
        color: #94a3b8;
        font-size: 11px;
        line-height: 1.5;
      }

      .demo-note code {
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        color: #cbd5e1;
      }

      .demo-control {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #94a3b8;
        font-size: 11px;
      }

      .demo-select,
      .demo-number,
      .demo-button {
        padding: 3px 7px;
        border: 1px solid #2f3b4f;
        border-radius: 5px;
        background: #1a2333;
        color: #e5e9f0;
        font-family: inherit;
        font-size: 11px;
        line-height: 1.4;
      }

      .demo-number {
        width: 64px;
      }

      .demo-checkbox {
        width: 15px;
        height: 15px;
        accent-color: #f59e0b;
        cursor: pointer;
      }

      .demo-color {
        width: 48px;
        height: 24px;
        padding: 1px 2px;
        cursor: pointer;
      }

      .demo-button {
        cursor: pointer;
      }

      .demo-button:hover {
        border-color: #f59e0b;
      }

      .demo-button:disabled,
      .demo-select:disabled,
      .demo-number:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .demo-button:disabled:hover {
        border-color: #2f3b4f;
      }

      /*
       * Every interactive element is operable by keyboard, so every one of them
       * has to show where the focus is.
       */
      .demo-select:focus-visible,
      .demo-number:focus-visible,
      .demo-checkbox:focus-visible,
      .demo-color:focus-visible,
      .demo-button:focus-visible,
      .demo-disclosure:focus-visible {
        outline: 2px solid #f59e0b;
        outline-offset: 1px;
      }

      .demo-status {
        margin: 0;
        padding: 4px 8px;
        border: 1px solid #24344d;
        border-radius: 5px;
        background: #0f1726;
        color: #cbd5e1;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11px;
        white-space: pre-wrap;
      }

      .demo-canvas {
        position: relative;
        flex: 1;
        min-height: 0;
        border: 1px solid #24344d;
        border-radius: 6px;
        overflow: hidden;
      }

      .demo-canvas [data-nodera-theme] {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: var(--ndr-colors-background, #f8fafc);
        color: var(--ndr-colors-text, #111827);
        font-family: var(--ndr-typography-font-family, system-ui);
        font-size: var(--ndr-typography-font-size-md, 13px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
