<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodera Phase 6 demo — SDK-only host</title>
    <style>
      /*
       * Host chrome only.
       *
       * The editor surfaces are styled by the framework with `var(--ndr-*)`
       * tokens, and the tokens are written by the SDK React binding on the
       * element it renders. The canvas engine ships its own base stylesheet,
       * which this host imports from `src/main.tsx` exactly like any other host
       * does; everything below either fills the viewport, styles the demo's own
       * controls and output columns, or supplies the token values the engine's
       * chrome reads.
       */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: #0b1220;
        color: #e5e9f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
      }

      .demo-host {
        display: flex;
        flex-direction: column;
        gap: 6px;
        height: 100%;
        padding: 6px;
        box-sizing: border-box;
      }

      .demo-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 6px 8px;
        border: 1px solid #24344d;
        border-radius: 6px;
        background: #131c2b;
      }

      .demo-bar h1 {
        margin: 0 8px 0 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .demo-control {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #94a3b8;
        font-size: 11px;
      }

      .demo-select,
      .demo-button {
        display: inline-flex;
        align-items: center;
        padding: 3px 7px;
        border: 1px solid #2f3b4f;
        border-radius: 5px;
        background: #1a2333;
        color: #e5e9f0;
        font-family: inherit;
        font-size: 11px;
        line-height: 1.4;
        cursor: pointer;
      }

      .demo-button:hover:not(:disabled),
      .demo-select:hover {
        border-color: #f59e0b;
      }

      .demo-button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .demo-status {
        margin: 0;
        padding: 4px 8px;
        border: 1px solid #24344d;
        border-radius: 5px;
        background: #0f1726;
        color: #cbd5e1;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11px;
        white-space: pre-wrap;
      }

      /* The editor column: the binding's theme wrapper fills it. */
      .demo-editor {
        position: relative;
        flex: 1;
        min-height: 0;
        border: 1px solid #24344d;
        border-radius: 6px;
        overflow: hidden;
      }

      .demo-editor [data-nodera-theme] {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: var(--ndr-colors-background, #f8fafc);
        color: var(--ndr-colors-text, #111827);
        font-family: var(--ndr-typography-font-family, system-ui);
        font-size: var(--ndr-typography-font-size-md, 13px);
      }

      .demo-output {
        display: grid;
        grid-template-columns: 1fr 1fr 1.6fr;
        gap: 6px;
        height: 190px;
        min-height: 0;
      }

      .demo-output-column {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        padding: 4px 8px;
        border: 1px solid #24344d;
        border-radius: 6px;
        background: #0f1726;
        overflow: hidden;
      }

      .demo-output-column h2 {
        margin: 0 0 4px;
        color: #94a3b8;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .demo-output-column p,
      .demo-output-column li {
        margin: 0;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
        color: #cbd5e1;
        word-break: break-word;
      }

      .demo-log {
        flex: 1;
        margin: 0;
        padding: 0;
        list-style: none;
        overflow: auto;
      }

      .demo-log li {
        display: flex;
        gap: 6px;
      }

      .demo-log-name {
        color: #f59e0b;
        flex-shrink: 0;
      }

      .demo-log-detail {
        color: #94a3b8;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .demo-document {
        flex: 1;
        margin: 0;
        overflow: auto;
        color: #cbd5e1;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .demo-issues {
        flex: 1;
        margin: 0;
        padding-left: 14px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
